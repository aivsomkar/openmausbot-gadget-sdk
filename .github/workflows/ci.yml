# SPDX-License-Identifier: Apache-2.0
# One workflow; each plan appends its own job and never edits another plan's job
# (docs/plans/00-interfaces.md §1.6). P1 owns the `protocol` and `fake-host` jobs.
name: ci
on: [push, pull_request]
permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run vectors:check
      - run: npm run test:protocol

  fake-host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:fake-host

  host-c:
    # P2a: core, the headless simulator and the C tests on both mbedTLS lines
    # (3.6.x like ESP-IDF 5.5, 4.x like ESP-IDF 6.0), on Linux and macOS.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        mbedtls: ["3.6.7", "4.2.0"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      # the e2e label runs firmware/tests/e2e/run.ts, whose fake host imports ws
      - run: npm ci
      - name: Configure
        run: >-
          cmake -S firmware -B build/host -DCMAKE_BUILD_TYPE=Debug -DGADGET_WITH_LVGL=OFF
          -DGADGET_MBEDTLS_VERSION=${{ matrix.mbedtls }}
      - name: Build
        run: cmake --build build/host -j4
      - name: Test
        run: ctest --test-dir build/host --output-on-failure --no-tests=error -L "unit|vectors|e2e"

  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - name: Root tools (the e2e label runs the fake host)
        run: npm ci
      - name: SDL2 for the simulator's window mode
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Configure (GADGET_WITH_LVGL defaults to ON)
        run: cmake -S firmware -B build/host -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build/host -j4
      - name: Unit, vector, end-to-end and snapshot tests
        run: ctest --test-dir build/host --output-on-failure -L "unit|vectors|e2e|snapshot"
      - name: Upload snapshot differences
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-diffs
          path: firmware/tests/snapshots/**/*_err.png
          if-no-files-found: ignore

  art-drift:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - name: Regenerate the Maus art (linux-x64 is the reference)
        working-directory: tools/art
        run: npm ci && npm test && npm run art
      - name: Committed art matches
        run: test -z "$(git status --porcelain -- firmware/ui/art)"
      - name: Art byte budget
        working-directory: tools/art
        run: npm run budget
      - name: Upload the regenerated art
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: art-linux-x64
          path: firmware/ui/art

  esp32:
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.0.3
    strategy:
      fail-fast: false
      matrix:
        board: [amoled-175c, amoled-175, lcd-154, devkit]
        variant: [plain]
        include:
          - board: amoled-175c
            variant: nvs-encrypt
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Port logic host tests and script tests
        if: matrix.board == 'amoled-175c' && matrix.variant == 'plain'
        run: |
          . "$IDF_PATH/export.sh"
          cmake -S firmware/ports/esp32/host-tests -B build/esp32-host
          cmake --build build/esp32-host -j"$(nproc)"
          ctest --test-dir build/esp32-host --output-on-failure
          firmware/ports/esp32/tools/test-check-size.sh
          firmware/ports/esp32/tools/test-check-art-profile.sh
      # Spec §10: all four boards one after another in one checkout, each with
      # its own sdkconfig, plus check-size.sh and check-art-profile.sh per board.
      - name: All four boards in one checkout (tools/build-all.sh)
        if: matrix.board == 'amoled-175c' && matrix.variant == 'plain'
        run: |
          . "$IDF_PATH/export.sh"
          git config --global --add safe.directory '*'
          cd firmware/ports/esp32 && tools/build-all.sh
      # Review Focus 1: a foreign sdkconfig stops the configure as a copied
      # file, and amoled-175c's own build directory refuses lcd-154 both with
      # its cached sdkconfig and with lcd-154's own.
      - name: Board guard refuses another board's sdkconfig
        if: matrix.board == 'amoled-175c' && matrix.variant == 'plain'
        run: |
          . "$IDF_PATH/export.sh"
          git config --global --add safe.directory '*'
          cd firmware/ports/esp32
          want="sdkconfig says board 'amoled-175c' but GADGET_BOARD is 'lcd-154'"
          mkdir -p build/guard-mix
          cp build/amoled-175c/sdkconfig build/guard-mix/sdkconfig
          if idf.py -B build/guard-mix -D GADGET_BOARD=lcd-154 -D SDKCONFIG=build/guard-mix/sdkconfig reconfigure >build/guard-mix.log 2>&1; then
            echo "the board guard accepted amoled-175c's sdkconfig for lcd-154" >&2
            exit 1
          fi
          grep -qF "$want" build/guard-mix.log
          # CMake wraps long messages, so join the log's lines before matching.
          want="build/amoled-175c belongs to board amoled-175c; build lcd-154 in build/lcd-154."
          if idf.py -B build/amoled-175c -D GADGET_BOARD=lcd-154 reconfigure >build/guard-reuse.log 2>&1; then
            echo "the board guard accepted build/amoled-175c for lcd-154" >&2
            exit 1
          fi
          tr -s '[:space:]' ' ' <build/guard-reuse.log | grep -qF "$want"
          if idf.py -B build/amoled-175c -D GADGET_BOARD=lcd-154 -D SDKCONFIG=build/lcd-154/sdkconfig reconfigure >build/guard-dir.log 2>&1; then
            echo "the board guard accepted build/amoled-175c for lcd-154 with lcd-154's sdkconfig" >&2
            exit 1
          fi
          tr -s '[:space:]' ' ' <build/guard-dir.log | grep -qF "$want"
      # build-all.sh already built and checked amoled-175c in its plain leg.
      - name: Build ${{ matrix.board }} (${{ matrix.variant }})
        if: matrix.board != 'amoled-175c' || matrix.variant != 'plain'
        run: |
          . "$IDF_PATH/export.sh"
          git config --global --add safe.directory '*'
          cd firmware/ports/esp32
          dir="build/${{ matrix.board }}"
          extra=""
          if [ "${{ matrix.variant }}" = "nvs-encrypt" ]; then
            dir="build/${{ matrix.board }}-nvs-encrypt"
            extra="-D GADGET_NVS_ENCRYPT=1"
          fi
          idf.py -B "$dir" -D GADGET_BOARD=${{ matrix.board }} -D SDKCONFIG="$dir/sdkconfig" $extra build
          tools/check-size.sh ${{ matrix.board }} "$dir"
          tools/check-art-profile.sh ${{ matrix.board }} "$dir"
      # Contract §1.4: git diff ignores a file that was never committed, so a
      # missing lock regenerated by the build is caught by git status.
      - name: Committed dependency lock is current
        if: matrix.variant == 'plain'
        run: |
          git config --global --add safe.directory '*'
          git diff --exit-code -- firmware/ports/esp32/dependencies.lock.${{ matrix.board }} && test -z "$(git status --porcelain -- firmware/ports/esp32/dependencies.lock.${{ matrix.board }})"

  esp32-idf55:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.5
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build amoled-175c on ESP-IDF v5.5.5
        run: |
          . "$IDF_PATH/export.sh"
          git config --global --add safe.directory '*'
          cd firmware/ports/esp32
          sed -i 's/idf: ">=6.0.3,<6.1"/idf: ">=5.5.5,<6.1"/' main/idf_component.yml
          rm -f dependencies.lock.amoled-175c
          idf.py -B build/amoled-175c -D GADGET_BOARD=amoled-175c -D SDKCONFIG=build/amoled-175c/sdkconfig build
          tools/check-size.sh amoled-175c

  site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Installer tests and build
        working-directory: site
        run: npm ci && npm test && npm run build
      - name: Release tools, licensing and docs tests
        run: node --test "tools/release/test/*.test.ts"
      - name: Release tools type check
        run: site/node_modules/.bin/tsc -p tools/release/tsconfig.json
      - name: Console helper tests
        run: python3 -B -m unittest discover -s tools/console -p 'test_*.py'
